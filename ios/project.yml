# The iPhone app and its keyboard, as an XcodeGen spec.
#
#   brew install xcodegen
#   cd ios && xcodegen && open LaTeXSquiggly.xcodeproj
#
# The .xcodeproj is generated and gitignored; edit this file instead.
# DEVELOPMENT_TEAM is the Personal Team; change it to sign with another
# team (Xcode > Settings > Accounts).

name: LaTeXSquiggly
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  # The repository's own package: the keyboard reuses the Mac app's engine.
  LaTeXSquiggly:
    path: ..
  # Native TeX typesetting, light enough for a keyboard extension.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    majorVersion: 1.0.0

settings:
  base:
    # Every target's Info.plist reads these, and App Store Connect rejects
    # an extension whose version differs from the app's.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: DL65G3N2U3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  LaTeXSquiggly:
    type: application
    platform: iOS
    # KeyboardUI too, for the debug-only keyboard preview.
    # The share sheet's and Messages' views too, for the debug screens.
    sources:
      - App
      - Shared
      - KeyboardUI
      - Render
      - Share/ShareViewController.swift
      - Messages/MessagesViewController.swift
    scheme:
      testTargets: [LookTests]
    dependencies:
      - target: Keyboard
      - target: Share
      - target: MessagesExtension
      - package: LaTeXSquiggly
        product: LaTeXUnicode
      - package: LaTeXSquiggly
        product: InputTracking
      - package: SwiftMath
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LaTeX Squiggly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The share sheet's Save Image needs this, or saving crashes the app.
        NSPhotoLibraryAddUsageDescription: Saves rendered equations to your photo library when you choose Save Image.
        # Paper, as the first screen is, rather than a white flash.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    # The App Group is how the keyboard reads the app's settings. The free
    # Personal Team cannot sign one; a paid team can.
    entitlements:
      path: App/LaTeXSquiggly.entitlements
      properties:
        com.apple.security.application-groups: [group.com.keenanjusak.latex-squiggly.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keenanjusak.latex-squiggly.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Keyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, KeyboardUI, Shared]
    dependencies:
      - package: LaTeXSquiggly
        product: LaTeXUnicode
      - package: LaTeXSquiggly
        product: InputTracking
      - package: SwiftMath
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: LaTeX Squiggly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: en-US
            # It types plain ASCII too, so iOS offers it in fields that
            # only take ASCII; it does not convert to symbols there.
            IsASCIICapable: true
            PrefersRightToLeft: false
            # Full Access is only for copying rendered images and reading
            # the app's settings. Everything else works without it, which
            # App Review requires.
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.keenanjusak.latex-squiggly.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keenanjusak.latex-squiggly.ios.keyboard

  # Select LaTeX in any app, tap Share, and it is rendered there.
  Share:
    type: app-extension
    platform: iOS
    sources: [Share, Shared, Render]
    dependencies:
      - package: LaTeXSquiggly
        product: LaTeXUnicode
      - package: SwiftMath
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: LaTeX Squiggly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: Saves rendered equations to your photo library when you choose Save Image.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keenanjusak.latex-squiggly.ios.share

  # In Messages' app drawer: write LaTeX and send it as an image. Not named
  # Messages, which would hide Apple's framework of that name.
  MessagesExtension:
    type: app-extension.messages
    platform: iOS
    sources: [Messages, Shared, Render]
    dependencies:
      - package: LaTeXSquiggly
        product: LaTeXUnicode
      - package: SwiftMath
    info:
      path: Messages/Info.plist
      properties:
        CFBundleDisplayName: LaTeX Squiggly
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keenanjusak.latex-squiggly.ios.messages
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon

  # Holds keys on Apple's keyboard and ours, for scripts/compare-keys.sh.
  LookTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LookTests]
    dependencies:
      - target: LaTeXSquiggly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keenanjusak.latex-squiggly.ios.looktests
        GENERATE_INFOPLIST_FILE: YES
