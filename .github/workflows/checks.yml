# Runs every check in the repository on every push to main and every pull
# request. The first job is scripts/check-all.sh, which is also what to run
# locally before pushing; the second types into real pages with the extension
# loaded.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all:
    name: All checks
    # macOS, because the Swift package includes the AppKit menu bar app.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Pinned: scripts/generate-swift-tables.py resolves characters against
      # Python's Unicode database, and the drift check compares its output
      # byte for byte with what is committed.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run every check
        run: scripts/check-all.sh

  extension-in-browser:
    name: Extension in a browser
    # Pinned rather than ubuntu-latest, so a new Ubuntu cannot break
    # Playwright's browser install without a change here to point at.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Playwright is a test tool, not a dependency of the extension, so it is
      # installed outside the repository rather than added to a package.json.
      - name: Install Playwright's Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/playwright" playwright
          npx --prefix "$RUNNER_TEMP/playwright" playwright install --with-deps chromium

      - name: Type into real pages
        run: node chrome/test/browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules

      # The macOS app's renderer window is the same page; this runs it against
      # a stand-in for the app. The app's side is built by the job above.
      - name: The macOS renderer window's page
        run: node chrome/test/mac-window.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules

      # So is the Android app's renderer; the app's side is built by the job
      # below.
      - name: The Android renderer's page
        run: node chrome/test/android-window.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/playwright/node_modules

  android:
    name: Android app
    # GitHub's Ubuntu image carries the Android SDK, which macOS's lacks.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: The engine against the conformance reference
        run: android/gradlew -p android :engine:conformance

      - name: Build the app
        run: android/gradlew -p android :app:assembleDebug :app:lintDebug

      # A debug build, signed with the runner's throwaway key: for trying on a
      # phone, not for the Play Store.
      - uses: actions/upload-artifact@v4
        with:
          name: latex-squiggly-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
