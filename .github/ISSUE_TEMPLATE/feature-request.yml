name: Feature request
description: A change to how LaTeX Squiggly behaves.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would solve it
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: macOS app
        - label: Windows app
        - label: Chrome extension
